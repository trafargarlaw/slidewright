name: Feature request
description: Suggest new syntax, a layout, or a capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For syntax proposals, include example Markdown.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
